name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm test
      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt -w cmd internal. Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet Go
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint Go
        run: $(go env GOPATH)/bin/golangci-lint run
      - name: Build Go
        run: go build ./...
      - name: Test Go
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      # The runner image already has the system libraries Chromium needs (it ships Google
      # Chrome), so skip `--with-deps`: its apt download from the Ubuntu mirror sometimes
      # took over 10 minutes. Only the headless shell is used (headless tests), and it is
      # cached per Playwright version.
      - name: Read Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - name: Install Chromium headless shell
        working-directory: web
        run: npx playwright install --only-shell chromium
      - name: Run end-to-end tests
        working-directory: web
        run: npm run e2e
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/e2e-screenshots
          retention-days: 14
