name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt -w cmd internal. Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet Go
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint Go
        run: $(go env GOPATH)/bin/golangci-lint run
      - name: Build Go
        run: go build ./...
      - name: Test Go
        run: go test ./...
