name: Application CI

# Pull requests get one run (not one for the push and one for the pull request);
# main is checked again after each merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm test
      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md
      # The root-run host scripts are reviewed like code (SC-037).
      - name: Check host scripts
        run: shellcheck -s sh deploy/bin/*
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Check Go toolchain
        shell: bash
        run: |
          want="$(awk '/^toolchain /{print $2}' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod toolchain: $want, CI Go: $have"
          if ! printf '%s\n%s\n' "$want" "$have" | sort -V -C; then
            echo "CI Go $have is older than the go.mod toolchain $want (SC-045)."
            exit 1
          fi
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt -w cmd internal. Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet Go
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint Go
        run: $(go env GOPATH)/bin/golangci-lint run
      - name: Build Go
        run: go build ./...
      # Blocks on any known vulnerability that the code can reach (SC-039, SC-045).
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test Go
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No Go cache here: this job only builds the server, and restoring the ~400 MB
      # cache counts against the account's Actions cache download limit.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      # The runner image already has the system libraries Chromium needs (it ships Google
      # Chrome), so skip `--with-deps`: its apt download from the Ubuntu mirror sometimes
      # took over 10 minutes. Only the headless shell is used (headless tests); it downloads
      # from Playwright's CDN in seconds, so it is not cached.
      - name: Install Chromium headless shell
        working-directory: web
        run: npx playwright install --only-shell chromium
      - name: Run end-to-end tests
        working-directory: web
        run: npm run e2e
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/e2e-screenshots
          retention-days: 14
