server {
    listen 80;
    listen [::]:80;
    server_name bratwurst-des-schicksals.de www.bratwurst-des-schicksals.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bratwurst-des-schicksals.de$request_uri;
    }
}
