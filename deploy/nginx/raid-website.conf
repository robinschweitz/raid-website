server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bratwurst-des-schicksals.de www.bratwurst-des-schicksals.de;

    ssl_certificate /etc/letsencrypt/live/bratwurst-des-schicksals.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bratwurst-des-schicksals.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bratwurst-des-schicksals.de www.bratwurst-des-schicksals.de;
    return 301 https://bratwurst-des-schicksals.de$request_uri;
}
